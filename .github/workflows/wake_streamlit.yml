name: Wake Streamlit App

on:
  schedule:
    # Run at 0 and 12 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:  # allow manual run

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://iaq-tracker.streamlit.app
