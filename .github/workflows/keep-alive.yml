name: Keep Services Alive

on:
  schedule:
    # Runs daily at 9pm UTC.
    - cron: '0 21 * * *'
  workflow_dispatch: # allows manual trigger from the GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (prevent 7-day inactivity pause)
        run: |
          curl -sf -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/control?select=stock_code&limit=1"
          echo "Supabase ping sent."

  ping-hf-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space (prevent 48h inactivity sleep)
        # After deploying to HF Spaces, replace the URL below with your actual Space URL.
        # Format: https://<your-hf-username>-<your-space-name>.hf.space
        # Leave HF_SPACE_URL unset to skip this step before deployment.
        run: |
          if [ -z "${{ secrets.HF_SPACE_URL }}" ]; then
            echo "HF_SPACE_URL not set — skipping HF Space ping."
          else
            curl -sf -o /dev/null "${{ secrets.HF_SPACE_URL }}" && echo "HF Space ping sent."
          fi
